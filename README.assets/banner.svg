  <path d="M110 246C187 145 260 145 330 219C399 293 466 283 531 201C598 117 671 98 743 169C818 243 882 263 956 167C1002 107 1048 84 1092 96"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.4" stroke-linecap="round"/>

  <g opacity="0.9" filter="url(#glow)">
    <circle cx="330" cy="219" r="7" fill="#00D1FF"/>
    <circle cx="531" cy="201" r="7" fill="#8B5CF6"/>
    <circle cx="743" cy="169" r="7" fill="#F43F5E"/>
    <circle cx="956" cy="167" r="7" fill="#00D1FF"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="88" y="100" fill="#E5E7EB" font-size="26" letter-spacing="7" opacity="0.86">PKU UNDERGRAD · NEURAL AI · BACKEND SYSTEMS</text>
    <text x="86" y="178" fill="#FFFFFF" font-size="66" font-weight="800">Yuxiang Xie</text>
    <text x="90" y="226" fill="#CBD5E1" font-size="27">Building reproducible ML pipelines and robust AI applications</text>
