<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070A13"/>
      <stop offset="0.45" stop-color="#10172A"/>
      <stop offset="1" stop-color="#2A0F1F"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="260" x2="1040" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D1FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="1040" cy="82" r="150" fill="#F43F5E" opacity="0.16"/>
  <circle cx="180" cy="298" r="180" fill="#00D1FF" opacity="0.12"/>
  <circle cx="650" cy="180" r="220" fill="#8B5CF6" opacity="0.10"/>

  <path d="M110 246C187 145 260 145 330 219C399 293 466 283 531 201C598 117 671 98 743 169C818 243 882 263 956 167C1002 107 1048 84 1092 96"
