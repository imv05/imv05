<svg width="1200" height="22" viewBox="0 0 1200 22" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0" y1="11" x2="1200" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D1FF"/>
      <stop offset="0.25" stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="0.75" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="8" width="1200" height="6" rx="3" fill="url(#line)" filter="url(#glow)"/>
</svg>
